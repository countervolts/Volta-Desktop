# Builds Volta Desktop on Linux, macOS and Windows.
#
#   git tag v0.2.0 && git push origin v0.2.0   -> build, then publish a GitHub release
#   Actions > Release > Run workflow           -> build only (nothing is published);
#                                                 a cheap way to check all three OSes compile
#   git commit -m "... [build]" && git push    -> same build-only run, for a push to main whose
#                                                 head commit message contains [build]
#
# The tag must match the version in Cargo.toml (`[workspace.package] version`),
# because the in-app update check compares the release tag with that version.
# Tags containing a "-" (v0.2.0-beta.1) are published as pre-releases, which the
# update check ignores.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          # v0.2.0-beta.1 is allowed to carry a pre-release suffix on top of Cargo's 0.2.0.
          if [ "${tag_version%%-*}" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    needs: [check-version]
    # Run when check-version passed or was skipped (non-tag runs), and the run was
    # asked for: a tag, the manual button, or "[build]" in the head commit message.
    # A plain push to main builds nothing.
    if: >-
      ${{ !cancelled()
      && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
      && (github.event_name != 'push'
          || startsWith(github.ref, 'refs/tags/v')
          || contains(github.event.head_commit.message, '[build]')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: macos-aarch64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev

      - name: Build
        run: cargo build --release --locked -p volta

      - name: Test
        run: cargo test --release --locked -p volta-logic -p volta-audio -p volta-services

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/volta-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" volta

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/volta.exe -DestinationPath "dist/volta-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"

      # The .app is unsigned and not notarized: macOS asks users to approve it
      # on first launch. Signing needs an Apple developer account.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          (cd crates/app && cargo bundle --release)
          mkdir -p dist
          ditto -c -k --keepParent target/release/bundle/osx/Volta.app "dist/volta-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: volta-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: volta-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "Volta Desktop $GITHUB_REF_NAME" $flags
