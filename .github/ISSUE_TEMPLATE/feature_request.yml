name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or the thing you're missing, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Volta to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Workarounds, or how other players handle it.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All of them
